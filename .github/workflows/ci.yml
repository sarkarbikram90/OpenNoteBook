name: CI

on:
  pull_request:
    branches:
      - main

jobs:
  rust:
    name: Rust Core CI (opennotebook_core)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend/rust
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "backend/rust -> target"

      - name: Check Rust Formatting
        run: cargo fmt --all -- --check

      - name: Lint with Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Run Rust Unit Tests
        run: cargo test --locked

  backend:
    name: Backend CI
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "backend/rust -> target"

      - name: Install Dependencies & Build Rust PyO3 Extension
        run: |
          python -m pip install --upgrade pip
          pip install maturin
          pip install -e "./backend[dev]"
          cd backend/rust && maturin develop --release --features python

      - name: Lint with Ruff
        run: |
          ruff check backend/app

      - name: Type Check with Mypy
        run: |
          mypy --config-file backend/pyproject.toml backend/app

      - name: Run Pytest
        run: |
          cd backend && pytest tests/evaluation tests/unit tests/integration/test_rag_pipeline.py -o addopts="" -q

  frontend:
    name: Frontend CI
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install Dependencies
        run: |
          cd frontend && npm ci

      - name: Lint with ESLint
        run: |
          cd frontend && npm run lint

      - name: Type Check with TSC
        run: |
          cd frontend && npm run typecheck

      - name: Run Vitest
        run: |
          cd frontend && npm test -- --run

  docker:
    name: Docker Build Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build API Image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: false
          tags: opennotebook-api:latest

      - name: Build Worker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./worker/Dockerfile
          push: false
          tags: opennotebook-worker:latest

      - name: Build Frontend Image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: false
          tags: opennotebook-frontend:latest
