name: Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  PROJECT_ID: ${{ secrets.GCP_PROJECT_ID || secrets.GCP_PROJECT || secrets.PROJECT_ID || 'gen-lang-client-0295924868' }}
  GAR_LOCATION: ${{ secrets.GCP_GAR_LOCATION || secrets.GAR_LOCATION || 'us-central1-docker.pkg.dev' }}
  REGION: ${{ secrets.GCP_REGION || 'asia-southeast1' }}
  REPOSITORY: opennotebook
  GCS_BUCKET: ${{ secrets.GCS_BUCKET || 'opennotebook-sources-gen-lang-client-0295924868' }}
  WIF_PROVIDER: ${{ secrets.WIF_PROVIDER || secrets.WORKLOAD_IDENTITY_PROVIDER }}
  WIF_SERVICE_ACCOUNT: ${{ secrets.WIF_SERVICE_ACCOUNT || secrets.GCP_SA_EMAIL || 'opennotebook-deployer@gen-lang-client-0295924868.iam.gserviceaccount.com' }}
  GCP_SA_KEY: ${{ secrets.GCP_SA_KEY || secrets.GCP_CREDENTIALS || secrets.GOOGLE_CREDENTIALS || secrets.GCP_SERVICE_ACCOUNT_KEY }}
  DATABASE_URL: ${{ secrets.DATABASE_URL }}

jobs:
  verify:
    name: Verify (unit + eval regression)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "backend/rust -> target"

      - name: Install Dependencies & Build Rust PyO3 Extension
        run: |
          python -m pip install --upgrade pip
          pip install maturin
          pip install -e "./backend[dev]"
          cd backend/rust && maturin develop --release --features python

      - name: Run unit, RAG integration, and evaluation regression tests
        run: |
          cd backend && pytest tests/evaluation tests/unit tests/integration/test_rag_pipeline.py -o addopts="" -q

  deploy:
    name: Build, Push, and Deploy
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Free Disk Space on Runner
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf /opt/hostedtoolcache/CodeQL
          sudo docker system prune -af --volumes || true
          df -h

      # ── Google Cloud Authentication ──────────────────────────────────────────

      - name: Validate GCP Authentication & Required Production Secrets
        env:
          JWT_SECRET_KEY_CHECK: ${{ secrets.JWT_SECRET_KEY }}
        run: |
          if [ -z "$WIF_PROVIDER" ] && [ -z "$GCP_SA_KEY" ]; then
            echo "::error::No GCP authentication configured! Please provide either Workload Identity Federation ('WIF_PROVIDER') or Service Account Key ('GCP_SA_KEY') in GitHub Repository Settings (Settings -> Secrets and variables -> Actions)."
            exit 1
          fi
          if [ -z "$DATABASE_URL" ]; then
            echo "::error::DATABASE_URL secret is required for production deployment."
            exit 1
          fi
          if [ -z "$JWT_SECRET_KEY_CHECK" ]; then
            echo "::error::JWT_SECRET_KEY secret is required for production deployment (never use hardcoded defaults)."
            exit 1
          fi

      - name: Google Auth (Workload Identity Federation)
        id: auth-wif
        if: env.WIF_PROVIDER != ''
        uses: google-github-actions/auth@v2
        with:
          token_format: 'access_token'
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.WIF_SERVICE_ACCOUNT }}

      - name: Google Auth (Service Account Key)
        id: auth-key
        if: env.WIF_PROVIDER == '' && env.GCP_SA_KEY != ''
        uses: google-github-actions/auth@v2
        with:
          token_format: 'access_token'
          credentials_json: ${{ env.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Login to Artifact Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.GAR_LOCATION }}
          username: oauth2accesstoken
          password: ${{ steps.auth-wif.outputs.access_token || steps.auth-key.outputs.access_token }}

      - name: Ensure Artifact Registry Repository Exists
        run: |
          if ! gcloud artifacts repositories describe ${{ env.REPOSITORY }} --location=${{ env.REGION }} --project=${{ env.PROJECT_ID }} >/dev/null 2>&1; then
            echo "Repository '${{ env.REPOSITORY }}' does not exist in region '${{ env.REGION }}'. Attempting auto-creation..."
            gcloud artifacts repositories create ${{ env.REPOSITORY }} \
              --repository-format=docker \
              --location=${{ env.REGION }} \
              --project=${{ env.PROJECT_ID }} \
              --description="OpenNotebook Docker images" || true
          fi

      # ── Build and Push Docker Images ──────────────────────────────────────

      - name: Build & Push API Image
        run: |
          TAG=${{ github.sha }}
          IMAGE_NAME=${{ env.GAR_LOCATION }}/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/api:${TAG}
          docker build -t ${IMAGE_NAME} ./backend
          docker push ${IMAGE_NAME}

      - name: Build & Push Worker Image
        run: |
          TAG=${{ github.sha }}
          IMAGE_NAME=${{ env.GAR_LOCATION }}/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/worker:${TAG}
          docker build -f ./worker/Dockerfile -t ${IMAGE_NAME} .
          docker push ${IMAGE_NAME}

      - name: Build & Push Frontend Image
        run: |
          TAG=${{ github.sha }}
          IMAGE_NAME=${{ env.GAR_LOCATION }}/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/frontend:${TAG}
          docker build -t ${IMAGE_NAME} ./frontend
          docker push ${IMAGE_NAME}

      # ── Run Database Migrations & Deploy to GCP Cloud Run ────────────────

      - name: Run Alembic Database Migrations (Cloud Run Job)
        env:
          JWT_SECRET_KEY: ${{ secrets.JWT_SECRET_KEY }}
        run: |
          API_IMAGE=${{ env.GAR_LOCATION }}/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/api:${{ github.sha }}
          gcloud run jobs deploy opennotebook-migrate \
            --image="${API_IMAGE}" \
            --region="${{ env.REGION }}" \
            --project="${{ env.PROJECT_ID }}" \
            --command="alembic" \
            --args="upgrade,head" \
            --memory="1Gi" \
            --cpu="1" \
            --task-timeout="300s" \
            --max-retries="1" \
            --set-env-vars="APP_ENV=production,DATABASE_URL=${DATABASE_URL},JWT_SECRET_KEY=${JWT_SECRET_KEY},STORAGE_PROVIDER=${{ secrets.STORAGE_PROVIDER || 'gcs' }},GCS_BUCKET=${{ env.GCS_BUCKET }}"
          gcloud run jobs execute opennotebook-migrate \
            --region="${{ env.REGION }}" \
            --project="${{ env.PROJECT_ID }}" \
            --wait

      - name: Deploy Worker to Cloud Run
        id: deploy-worker
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: opennotebook-worker
          image: ${{ env.GAR_LOCATION }}/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/worker:${{ github.sha }}
          region: ${{ env.REGION }}
          flags: |
            --allow-unauthenticated
            --command=uvicorn
            --args=app.worker.http_worker:app,--host,0.0.0.0,--port,8080
            --port=8080
            --memory=4Gi
            --cpu=2
            --cpu-boost
            --min-instances=0
            --max-instances=5
            --timeout=900
          env_vars: |
            APP_ENV=production
            LOG_FORMAT=json
            LOG_LEVEL=INFO
            JWT_SECRET_KEY=${{ secrets.JWT_SECRET_KEY }}
            STORAGE_PROVIDER=${{ secrets.STORAGE_PROVIDER || 'gcs' }}
            GCS_BUCKET=${{ env.GCS_BUCKET }}
            GCS_PROJECT_ID=${{ env.PROJECT_ID }}
            GCS_TIMEOUT_SECONDS=60
            PUBSUB_TOPIC_NAME=${{ secrets.PUBSUB_TOPIC_NAME || 'opennotebook-gcs-events' }}
            PUBSUB_VERIFICATION_TOKEN=${{ secrets.PUBSUB_VERIFICATION_TOKEN }}
            WORKER_AUTH_TOKEN=${{ secrets.WORKER_AUTH_TOKEN || secrets.PUBSUB_VERIFICATION_TOKEN }}
            VECTOR_STORE_PROVIDER=${{ secrets.VECTOR_STORE_PROVIDER || 'pgvector' }}
            EMBEDDING_PROVIDER=${{ secrets.EMBEDDING_PROVIDER || 'local' }}
            VERTEX_AI_LOCATION=${{ secrets.VERTEX_AI_LOCATION || 'us-central1' }}
            VERTEX_AI_EMBEDDING_MODEL=${{ secrets.VERTEX_AI_EMBEDDING_MODEL || 'text-embedding-004' }}
            IMAGE_VISION_PROVIDER=${{ secrets.IMAGE_VISION_PROVIDER || 'tesseract' }}
            DATABASE_URL=${{ secrets.DATABASE_URL }}
            GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }}
            LLM_PROVIDER=${{ secrets.LLM_PROVIDER || (secrets.GEMINI_API_KEY && 'gemini') || 'ollama' }}
            GEMINI_MODEL=${{ secrets.GEMINI_MODEL || 'gemini-1.5-flash' }}

      - name: Deploy API to Cloud Run
        id: deploy-api
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: opennotebook-api
          image: ${{ env.GAR_LOCATION }}/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/api:${{ github.sha }}
          region: ${{ env.REGION }}
          flags: |
            --allow-unauthenticated
            --port=8080
            --memory=2Gi
            --cpu=2
            --cpu-boost
            --no-cpu-throttling
            --min-instances=1
            --timeout=300
          env_vars: |
            APP_ENV=production
            LOG_FORMAT=json
            LOG_LEVEL=INFO
            JWT_SECRET_KEY=${{ secrets.JWT_SECRET_KEY }}
            MINIO_SECRET_KEY=${{ secrets.MINIO_SECRET_KEY }}
            STORAGE_PROVIDER=${{ secrets.STORAGE_PROVIDER || 'gcs' }}
            GCS_BUCKET=${{ env.GCS_BUCKET }}
            GCS_PROJECT_ID=${{ env.PROJECT_ID }}
            GCS_TIMEOUT_SECONDS=60
            GCS_SIGNED_URL_EXPIRATION_SECONDS=900
            PUBSUB_TOPIC_NAME=${{ secrets.PUBSUB_TOPIC_NAME || 'opennotebook-gcs-events' }}
            PUBSUB_VERIFICATION_TOKEN=${{ secrets.PUBSUB_VERIFICATION_TOKEN }}
            WORKER_HTTP_URL=${{ steps.deploy-worker.outputs.url }}
            WORKER_AUTH_TOKEN=${{ secrets.WORKER_AUTH_TOKEN || secrets.PUBSUB_VERIFICATION_TOKEN }}
            VECTOR_STORE_PROVIDER=${{ secrets.VECTOR_STORE_PROVIDER || 'pgvector' }}
            EMBEDDING_PROVIDER=${{ secrets.EMBEDDING_PROVIDER || 'local' }}
            VERTEX_AI_LOCATION=${{ secrets.VERTEX_AI_LOCATION || 'us-central1' }}
            VERTEX_AI_EMBEDDING_MODEL=${{ secrets.VERTEX_AI_EMBEDDING_MODEL || 'text-embedding-004' }}
            IMAGE_VISION_PROVIDER=${{ secrets.IMAGE_VISION_PROVIDER || 'tesseract' }}
            DATABASE_URL=${{ secrets.DATABASE_URL }}
            GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }}
            LLM_PROVIDER=${{ secrets.LLM_PROVIDER || (secrets.GEMINI_API_KEY && 'gemini') || 'ollama' }}
            GEMINI_MODEL=${{ secrets.GEMINI_MODEL || 'gemini-1.5-flash' }}

      - name: Deploy Frontend to Cloud Run
        id: deploy-frontend
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: opennotebook-frontend
          image: ${{ env.GAR_LOCATION }}/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/frontend:${{ github.sha }}
          region: ${{ env.REGION }}
          flags: |
            --allow-unauthenticated
            --port=8080
            --memory=512Mi
            --cpu=1
            --min-instances=1
          env_vars: |
            BACKEND_URL=${{ steps.deploy-api.outputs.url }}

      - name: Verify Cloud Run Deployments
        run: |
          echo "=========================================="
          echo "Cloud Run Deployment Succeeded"
          echo "API URL:      ${{ steps.deploy-api.outputs.url }}"
          echo "Worker URL:   ${{ steps.deploy-worker.outputs.url }}"
          echo "Frontend URL: ${{ steps.deploy-frontend.outputs.url }}"
          echo "=========================================="
