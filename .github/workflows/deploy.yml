name: Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  PROJECT_ID: ${{ secrets.GCP_PROJECT_ID || secrets.GCP_PROJECT || secrets.PROJECT_ID || 'founders-club-507318' }}
  GAR_LOCATION: ${{ secrets.GCP_GAR_LOCATION || secrets.GAR_LOCATION || 'us-central1-docker.pkg.dev' }}
  REGION: ${{ secrets.GCP_REGION || 'us-central1' }}
  REPOSITORY: opennotebook
  WIF_PROVIDER: ${{ secrets.WIF_PROVIDER || secrets.WORKLOAD_IDENTITY_PROVIDER }}
  WIF_SERVICE_ACCOUNT: ${{ secrets.WIF_SERVICE_ACCOUNT || secrets.GCP_SA_EMAIL || 'opennotebook-deployer@founders-club-507318.iam.gserviceaccount.com' }}
  GCP_SA_KEY: ${{ secrets.GCP_SA_KEY || secrets.GCP_CREDENTIALS || secrets.GOOGLE_CREDENTIALS || secrets.GCP_SERVICE_ACCOUNT_KEY }}

jobs:
  verify:
    name: Verify (unit + eval regression)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e "./backend[dev]"

      - name: Run unit + evaluation regression tests
        run: |
          cd backend && pytest tests/evaluation tests/unit -o addopts="" -q

  deploy:
    name: Build, Push, and Deploy
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # ── Google Cloud Authentication ──────────────────────────────────────────

      - name: Validate GCP Authentication Configuration
        run: |
          if [ -z "$WIF_PROVIDER" ] && [ -z "$GCP_SA_KEY" ]; then
            echo "::error::No GCP authentication configured! Please provide either Workload Identity Federation ('WIF_PROVIDER') or Service Account Key ('GCP_SA_KEY') in GitHub Repository Settings (Settings -> Secrets and variables -> Actions)."
            exit 1
          fi

      - name: Google Auth (Workload Identity Federation)
        id: auth-wif
        if: env.WIF_PROVIDER != ''
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.WIF_SERVICE_ACCOUNT }}

      - name: Google Auth (Service Account Key)
        id: auth-key
        if: env.WIF_PROVIDER == '' && env.GCP_SA_KEY != ''
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ env.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker
        run: |
          gcloud auth configure-docker ${{ env.GAR_LOCATION }} --quiet

      - name: Ensure Artifact Registry Repository Exists
        run: |
          if ! gcloud artifacts repositories describe ${{ env.REPOSITORY }} --location=${{ env.REGION }} --project=${{ env.PROJECT_ID }} >/dev/null 2>&1; then
            echo "Repository '${{ env.REPOSITORY }}' does not exist in region '${{ env.REGION }}'. Attempting auto-creation..."
            gcloud artifacts repositories create ${{ env.REPOSITORY }} \
              --repository-format=docker \
              --location=${{ env.REGION }} \
              --project=${{ env.PROJECT_ID }} \
              --description="OpenNotebook Docker images" || true
          fi

      # ── Build and Push Docker Images ──────────────────────────────────────

      - name: Build & Push API Image
        run: |
          TAG=${{ github.sha }}
          IMAGE_NAME=${{ env.GAR_LOCATION }}/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/api:${TAG}
          docker build -t ${IMAGE_NAME} ./backend
          docker push ${IMAGE_NAME}

      - name: Build & Push Worker Image
        run: |
          TAG=${{ github.sha }}
          IMAGE_NAME=${{ env.GAR_LOCATION }}/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/worker:${TAG}
          docker build -f ./worker/Dockerfile -t ${IMAGE_NAME} .
          docker push ${IMAGE_NAME}

      - name: Build & Push Frontend Image
        run: |
          TAG=${{ github.sha }}
          IMAGE_NAME=${{ env.GAR_LOCATION }}/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/frontend:${TAG}
          docker build -t ${IMAGE_NAME} ./frontend
          docker push ${IMAGE_NAME}

      # ── Deploy to GCP Cloud Run ──────────────────────────────────────────

      - name: Deploy API to Cloud Run
        id: deploy-api
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: opennotebook-api
          image: ${{ env.GAR_LOCATION }}/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/api:${{ github.sha }}
          region: ${{ env.REGION }}
          flags: '--allow-unauthenticated'
          env_vars: |
            APP_ENV=production
            LOG_FORMAT=json
            LOG_LEVEL=INFO

      - name: Deploy Frontend to Cloud Run
        id: deploy-frontend
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: opennotebook-frontend
          image: ${{ env.GAR_LOCATION }}/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/frontend:${{ github.sha }}
          region: ${{ env.REGION }}
          flags: '--allow-unauthenticated'
          env_vars: |
            BACKEND_URL=${{ steps.deploy-api.outputs.url }}

      - name: Verify Cloud Run Deployments
        run: |
          echo "=========================================="
          echo "Cloud Run Deployment Succeeded"
          echo "API URL:      ${{ steps.deploy-api.outputs.url }}"
          echo "Frontend URL: ${{ steps.deploy-frontend.outputs.url }}"
          echo "=========================================="
