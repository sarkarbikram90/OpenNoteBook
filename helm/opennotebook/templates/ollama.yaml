apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: ollama-pvc
  namespace: {{ .Release.Namespace }}
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: {{ .Values.ollama.storageSize }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: opennotebook-ollama
  namespace: {{ .Release.Namespace }}
  labels:
    app: opennotebook-ollama
spec:
  replicas: 1
  selector:
    matchLabels:
      app: opennotebook-ollama
  template:
    metadata:
      labels:
        app: opennotebook-ollama
    spec:
      containers:
        - name: ollama
          image: {{ .Values.ollama.image }}
          ports:
            - containerPort: 11434
              name: ollama
          volumeMounts:
            - name: ollama-storage
              mountPath: /root/.ollama
          resources:
            {{- if .Values.ollama.gpu.enabled }}
            limits:
              {{ .Values.ollama.gpu.type }}: {{ .Values.ollama.gpu.count | quote }}
              cpu: {{ .Values.ollama.resources.limits.cpu | quote }}
              memory: {{ .Values.ollama.resources.limits.memory | quote }}
            requests:
              {{ .Values.ollama.gpu.type }}: {{ .Values.ollama.gpu.count | quote }}
              cpu: {{ .Values.ollama.resources.requests.cpu | quote }}
              memory: {{ .Values.ollama.resources.requests.memory | quote }}
            {{- else }}
            {{- toYaml .Values.ollama.resources | nindent 12 }}
            {{- end }}
      volumes:
        - name: ollama-storage
          persistentVolumeClaim:
            claimName: ollama-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: opennotebook-ollama
  namespace: {{ .Release.Namespace }}
spec:
  ports:
    - port: 11434
      targetPort: ollama
  selector:
    app: opennotebook-ollama
