apiVersion: v1
kind: Secret
metadata:
  name: opennotebook-secrets
  namespace: {{ .Release.Namespace }}
type: Opaque
stringData:
  # Values are REQUIRED in production. Provide them via --set or an external
  # secrets operator; do not commit real secrets to this chart.
  JWT_SECRET_KEY: {{ required "secrets.jwtSecretKey is required" .Values.secrets.jwtSecretKey | quote }}
  POSTGRES_USER: {{ .Values.secrets.postgresUser | default "opennotebook" | quote }}
  POSTGRES_PASSWORD: {{ required "secrets.postgresPassword is required" .Values.secrets.postgresPassword | quote }}
  POSTGRES_DB: {{ .Values.secrets.postgresDb | default "opennotebook" | quote }}
  MINIO_ACCESS_KEY: {{ required "secrets.minioAccessKey is required" .Values.secrets.minioAccessKey | quote }}
  MINIO_SECRET_KEY: {{ required "secrets.minioSecretKey is required" .Values.secrets.minioSecretKey | quote }}
  # Derived so the app always uses the configured credentials (overrides the
  # value in the ConfigMap, which contains no password).
  DATABASE_URL: "postgresql+asyncpg://{{ .Values.secrets.postgresUser | default "opennotebook" }}:{{ .Values.secrets.postgresPassword }}@opennotebook-postgres:5432/{{ .Values.secrets.postgresDb | default "opennotebook" }}"
