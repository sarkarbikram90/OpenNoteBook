apiVersion: v1
kind: Secret
metadata:
  name: opennotebook-secrets
  namespace: {{ .Release.Namespace }}
type: Opaque
data:
  # Base64 encoded values for jwt secret key, minio keys, and postgres password
  JWT_SECRET_KEY: {{ "change-me-to-a-random-64-char-string-for-prod-security-keys" | b64enc | quote }}
  POSTGRES_USER: {{ "opennotebook" | b64enc | quote }}
  POSTGRES_PASSWORD: {{ "opennotebook" | b64enc | quote }}
  POSTGRES_DB: {{ "opennotebook" | b64enc | quote }}
  MINIO_ACCESS_KEY: {{ "minioadmin" | b64enc | quote }}
  MINIO_SECRET_KEY: {{ "minioadmin" | b64enc | quote }}
