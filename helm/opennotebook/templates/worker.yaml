apiVersion: apps/v1
kind: Deployment
metadata:
  name: opennotebook-worker
  namespace: {{ .Release.Namespace }}
  labels:
    app: opennotebook-worker
spec:
  replicas: {{ .Values.worker.replicaCount }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 1
  selector:
    matchLabels:
      app: opennotebook-worker
  template:
    metadata:
      labels:
        app: opennotebook-worker
    spec:
      containers:
        - name: worker
          image: "{{ .Values.global.registry }}/worker:{{ .Values.global.tag }}"
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          command: ["celery", "-A", "app.worker.celery_app", "worker", "--loglevel=INFO", "-Q", "processing,default"]
          envFrom:
            - configMapRef:
                name: opennotebook-config
            - secretRef:
                name: opennotebook-secrets
          readinessProbe:
            exec:
              command: ["celery", "-A", "app.worker.celery_app", "inspect", "ping", "--timeout", "10"]
            initialDelaySeconds: 30
            periodSeconds: 20
          livenessProbe:
            exec:
              command: ["celery", "-A", "app.worker.celery_app", "inspect", "ping", "--timeout", "10"]
            initialDelaySeconds: 60
            periodSeconds: 30
          resources:
            {{- toYaml .Values.worker.resources | nindent 12 }}
