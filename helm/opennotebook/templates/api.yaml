apiVersion: apps/v1
kind: Deployment
metadata:
  name: opennotebook-api
  namespace: {{ .Release.Namespace }}
  labels:
    app: opennotebook-api
spec:
  replicas: {{ .Values.api.replicaCount }}
  selector:
    matchLabels:
      app: opennotebook-api
  template:
    metadata:
      labels:
        app: opennotebook-api
    spec:
      containers:
        - name: api
          image: "{{ .Values.global.registry }}/api:{{ .Values.global.tag }}"
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          ports:
            - containerPort: {{ .Values.api.port }}
              name: http
          envFrom:
            - configMapRef:
                name: opennotebook-config
            - secretRef:
                name: opennotebook-secrets
          readinessProbe:
            httpGet:
              path: /api/v1/health
              port: {{ .Values.api.port }}
            initialDelaySeconds: 15
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/v1/health
              port: {{ .Values.api.port }}
            initialDelaySeconds: 20
            periodSeconds: 15
          resources:
            {{- toYaml .Values.api.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: opennotebook-api
  namespace: {{ .Release.Namespace }}
  labels:
    app: opennotebook-api
spec:
  ports:
    - port: {{ .Values.api.port }}
      targetPort: http
      protocol: TCP
      name: http
  selector:
    app: opennotebook-api
