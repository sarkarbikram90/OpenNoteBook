[project]
name = "opennotebook"
version = "0.1.0"
description = "Your private, open-source AI research assistant. Understand anything. Keep everything local."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.12"
authors = [{ name = "OpenNotebook Contributors" }]
keywords = ["ai", "rag", "notebook", "research", "llm", "open-source"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Framework :: FastAPI",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    # ── Web Framework ────────────────────────
    "fastapi>=0.111,<1.0",
    "uvicorn[standard]>=0.29,<1.0",
    "gunicorn>=22.0,<23.0",
    "pydantic>=2.7,<3.0",
    "pydantic-settings>=2.2,<3.0",
    "email-validator>=2.1,<3.0",

    # ── Database & ORM ───────────────────────
    "sqlalchemy[asyncio]>=2.0,<3.0",
    "asyncpg>=0.29,<1.0",
    "alembic>=1.13,<2.0",

    # ── Task Queue ───────────────────────────
    "celery[redis]>=5.3,<6.0",
    "redis>=5.0,<6.0",

    # ── Auth ─────────────────────────────────
    "python-jose[cryptography]>=3.3,<4.0",
    "bcrypt>=4.1,<6.0",

    # ── HTTP Client ──────────────────────────
    "httpx>=0.27,<1.0",

    # ── Rate Limiting ────────────────────────
    "slowapi>=0.1.9,<1.0",

    # ── AI / ML ──────────────────────────────
    "sentence-transformers>=2.7,<3.0",
    "qdrant-client>=1.9,<2.0",
    "rank-bm25>=0.2.2,<1.0",

    # ── Document Processing ──────────────────
    "PyMuPDF>=1.24,<2.0",
    "python-docx>=1.1,<2.0",
    "trafilatura>=1.8,<2.0",
    "youtube-transcript-api>=0.6,<1.0",

    # ── Object Storage ───────────────────────
    "minio>=7.2,<8.0",

    # ── Observability ────────────────────────
    "opentelemetry-api>=1.24,<2.0",
    "opentelemetry-sdk>=1.24,<2.0",
    "opentelemetry-instrumentation-fastapi>=0.45b0",
    "opentelemetry-instrumentation-sqlalchemy>=0.45b0",
    "opentelemetry-instrumentation-celery>=0.45b0",
    "opentelemetry-exporter-otlp>=1.24,<2.0",
    "prometheus-client>=0.20,<1.0",

    # ── Logging ──────────────────────────────
    "structlog>=24.1,<25.0",
    "python-json-logger>=2.0,<3.0",

    # ── Utilities ────────────────────────────
    "python-multipart>=0.0.9",

    # ── PDF Export ───────────────────────────────
    "fpdf2>=2.7,<3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.1,<9.0",
    "pytest-asyncio>=0.23,<1.0",
    "pytest-cov>=5.0,<6.0",
    "factory-boy>=3.3,<4.0",
    "testcontainers[postgres,redis]>=4.0,<5.0",
    "respx>=0.21,<1.0",
    "httpx>=0.27,<1.0",
    "ruff>=0.4,<1.0",
    "mypy>=1.10,<2.0",
    "pre-commit>=3.7,<4.0",
]

[project.entry-points."opennotebook.extractors"]
# Register custom extractor plugins here
# my_format = "my_package:MyExtractor"

[project.entry-points."opennotebook.chunkers"]
# Register custom chunker plugins here
# my_chunker = "my_package:MyChunker"

[build-system]
requires = ["setuptools>=69.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

# ── Ruff (linter + formatter) ────────────────

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "N",    # pep8-naming
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "S",    # flake8-bandit (security)
    "A",    # flake8-builtins
    "C4",   # flake8-comprehensions
    "DTZ",  # flake8-datetimez
    "T20",  # flake8-print
    "RET",  # flake8-return
    "SIM",  # flake8-simplify
    "TCH",  # flake8-type-checking
    "ARG",  # flake8-unused-arguments
    "PTH",  # flake8-use-pathlib
    "RUF",  # Ruff-specific rules
]
ignore = [
    "S101",  # assert used (OK in tests)
    "B008",  # function call in default argument (FastAPI Depends)
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101", "ARG001", "ARG002"]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"

# ── Mypy (type checking) ─────────────────────

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_any_generics = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
show_error_codes = true
namespace_packages = true

[[tool.mypy.overrides]]
module = [
    "celery.*",
    "minio.*",
    "qdrant_client.*",
    "sentence_transformers.*",
    "rank_bm25.*",
    "fitz.*",
    "docx.*",
    "trafilatura.*",
    "youtube_transcript_api.*",
    "slowapi.*",
    "jose.*",
    "bcrypt.*",
]
ignore_missing_imports = true

# ── Pytest ───────────────────────────────────

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = [
    "-ra",
    "--strict-markers",
    "--strict-config",
    "--cov=app",
    "--cov-report=term-missing",
    "--cov-report=html:htmlcov",
    "--cov-fail-under=80",
]
markers = [
    "unit: Unit tests (no external dependencies)",
    "integration: Integration tests (require running services)",
    "slow: Slow-running tests",
]
filterwarnings = [
    "error",
    "ignore::DeprecationWarning:celery.*",
]

[tool.coverage.run]
source = ["app"]
omit = [
    "app/scripts/*",
    "app/worker/celery_app.py",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.",
    "raise NotImplementedError",
    "pass",
    "\\.\\.\\.",
]
